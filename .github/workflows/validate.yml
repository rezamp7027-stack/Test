name: Validate frontend

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Validate required frontend files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          grep -q '<html lang="fa" dir="rtl">' index.html
          grep -q 'styles.css' index.html
          grep -q 'app.js' index.html
